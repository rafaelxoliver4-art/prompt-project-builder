# Mobile Price Tracker — sources of truth.
# Edit THIS file to add states, carriers, categories, or change the schedule.
# Code reads this; nothing about URLs/states/schedule should be hardcoded in Python.

project:
  name: mobile-price-tracker
  currency: BRL
  timezone: America/Sao_Paulo
  # Daily at 18:00 BRT (UTC-3) == 21:00 UTC. Matches the live GitHub Actions cron. (Documentation
  # only — the workflow hardcodes the cron; this records the intended schedule.)
  schedule_cron_utc: "0 21 * * *"
  output_xlsx: data/mobile_plans.xlsx
  raw_capture_dir: data/raw   # saved HTML/JSON per run, for audit & re-parsing

# Politeness / anti-fragility knobs (see GOVERNANCE §3).
scraping:
  runs_per_day: 1
  min_delay_seconds: 2
  max_delay_seconds: 6
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  request_timeout_seconds: 30
  headless: true

# Prepaid normalization (#18). The Pre matrix column compares the cheapest PREPAID plan whose
# validity_days >= min_validity_days — i.e. a real 30-day plan (not the "R$1/day" headline or a
# 15-day tier). Adapters parse each prepaid plan's validity_days; the matrix filters on it.
prepaid:
  min_validity_days: 28      # a "30-day" plan in practice (carriers show 30; 28 gives margin)

# Daily price-change email alert (≥ threshold_pct move, up or down, vs the previous snapshot).
# NON-SECRET config only — the SMTP password is read from the EMAIL_APP_PASSWORD env var
# (a GitHub Actions Secret), NEVER stored here or committed.
alerts:
  enabled: true
  threshold_pct: 3.0
  from_email: ibotatom@gmail.com
  to_email: rafaelxoliver4@gmail.com
  smtp_host: smtp.gmail.com
  smtp_port: 587

# Geography. SP only is active now; others are pre-listed but inactive.
states:
  - code: SP
    name: São Paulo
    active: true
  - code: RJ
    name: Rio de Janeiro
    active: false
  - code: MG
    name: Minas Gerais
    active: false

# Carriers, their render strategy (from recon — see CONTEXT §3), and the pages per category.
# `state_in_url`: TIM puts the state in the path, so {state} is templated; Vivo/Claro use geolocation.
carriers:
  vivo:
    display_name: Vivo
    render: aem            # try AEM .model.json first, else playwright
    state_in_url: false
    base: https://vivo.com.br
    categories:
      postpaid:
        label: Pós-pago
        url: https://vivo.com.br/para-voce/produtos-e-servicos/para-o-celular/planos-pos-pago
      control:
        label: Controle
        url: https://vivo.com.br/para-voce/produtos-e-servicos/para-o-celular/planos-controle
      lite:
        label: Vivo Easy/Lite
        url: https://vivo.com.br/para-voce/produtos-e-servicos/para-o-celular/easy-lite
      prepaid:
        label: Pré-pago
        url: https://vivo.com.br/para-voce/produtos-e-servicos/para-o-celular/pre-pago/vivo-pre

  claro:
    display_name: Claro
    render: nextjs         # parse __NEXT_DATA__ JSON first, else playwright
    state_in_url: false
    base: https://www.claro.com.br
    categories:
      postpaid:
        label: Pós
        url: https://www.claro.com.br/celular/pos
      control:
        label: Controle
        url: https://www.claro.com.br/celular/controle
      flex:
        label: Flex
        url: https://www.claro.com.br/celular/flex
      prepaid:
        label: Prezão (Pré)
        url: https://www.claro.com.br/celular/planos-pre/prezao

  tim:
    display_name: TIM
    render: html           # server-rendered Drupal; watch for SVG-embedded prices
    state_in_url: true     # {state} lowercased goes into the path
    base: https://www.tim.com.br
    categories:
      prepaid:
        label: Pré-pago
        url: https://www.tim.com.br/{state}/para-voce/planos/pre-pago
      control:
        label: Controle
        url: https://www.tim.com.br/{state}/para-voce/planos/controle
      postpaid:
        label: Pós (TIM Black)
        url: https://www.tim.com.br/{state}/para-voce/planos/pos-pago/tim-black
      # TIM Controle Fit (#28) — TIM's digital line (Digital peer of Vivo Lite / Claro Flex). The plans
      # live ON the controle page (anchor #price-fit) as server-rendered TEXT, NOT in the ofertas JSON,
      # so this is a separate target on the same URL with a dedicated parser path (category == "fit").
      fit:
        label: TIM Fit (digital)
        url: https://www.tim.com.br/{state}/para-voce/planos/controle

# ---------------------------------------------------------------------------------------------
# CONVERGENT (combo) offers — a SEPARATE data domain (#31, CONTEXT §14): bundles of mobile + fixed
# broadband (+ TV / landline) sold at one monthly price. Written to the `convergent_history` sheet;
# the mobile pipeline above is completely unaffected. The daily job scrapes these AFTER the mobile
# scrape, fully GUARDED — any convergent failure is logged and skipped, never blocking mobile.
#
# `adapter` names the convergent adapter to use (registry: adapters/__init__.py CONVERGENT_ADAPTERS).
# Only carriers listed here with `active: true` are scraped.
#
# Investigation 2026-08-03 (CONTEXT §14) — all three pages are DISCRETE priced tiers, not
# "monte seu combo" configurators:
#   * TIM Ultracombo  — plain httpx (Drupal settings JSON). IMPLEMENTED (phase 1).
#   * Vivo Total      — Playwright required (Cloudflare 403 on httpx); `.unique-card` grid. PHASE 2.
#   * Claro Multi     — httpx page + one public /api/catalog call for prices. PHASE 2.
convergent:
  tim:
    display_name: TIM Ultracombo
    active: true
    adapter: tim_ultracombo
    state_in_url: true
    category: ultracombo
    label: TIM Ultracombo (fibra + móvel)
    url: https://www.tim.com.br/{state}/internet/tim-ultracombo
  vivo:
    display_name: Vivo Total
    active: true             # #32 — Playwright render (httpx is 403 behind Cloudflare)
    adapter: vivo_total
    state_in_url: false
    category: total
    label: Vivo Total (fibra + móvel)
    url: https://vivo.com.br/para-voce/produtos-e-servicos/combos/vivo-total
  claro:
    display_name: Claro Multi
    active: true             # #32 — httpx page + ONE batched /api/catalog call for prices
    adapter: claro_multi
    state_in_url: false
    category: multi
    label: Claro Multi (fibra + móvel [+ TV])
    url: https://www.claro.com.br/multi
    # the catalog call takes the city as an explicit slug; unset → derived from the active state
    api_city: sao_paulo
