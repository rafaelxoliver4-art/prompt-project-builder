name: mobile-price-tracker-watchdog

# "Did the daily job actually run?" — the one failure the tracker itself cannot report.
#
# The sanity guardrail only validates data when the scrape RUNS, and the staleness check only fires
# on a run that happens. A job that dies early — or never fires at all — is completely silent. That
# is exactly what happened on 2026-08-04: the scheduled run failed in the test step BEFORE scraping,
# and the day's snapshot was lost with nobody told (#37/F3).
#
# This workflow READS the committed workbook and e-mails if today's snapshot_date is absent.
# It does NOT scrape, does NOT write, and does NOT commit — so it can never interfere with the main
# job (see the guards below). Schedule: 03:30 UTC == 00:30 BRT — just after the Sao Paulo day
# closes, so all four of the day's collection passes (#41) have had their chance first.

on:
  workflow_dispatch:          # manual "is the history current?" check
  schedule:
    # AFTER the last catch-up pass (#41). The tracker now gets four chances across the São Paulo
    # day, the final one at 23:30 BRT; asking "did today get a snapshot?" before those have run
    # would cry wolf. 03:30 UTC == 00:30 BRT, i.e. just after the SP day closes.
    - cron: "30 3 * * *"

# READ-ONLY. The main job needs `contents: write` to commit the snapshot; the watchdog must never be
# able to touch the repo, so it gets the minimum. This is the hard guard against interference.
permissions:
  contents: read

# Never queue behind / cancel the scrape: a separate concurrency group from the main workflow, and
# no cancel-in-progress, so the two can never contend.
concurrency:
  group: mobile-price-tracker-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # a read + compare + e-mail; anything longer is a hang
    defaults:
      run:
        working-directory: projects/mobile-price-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Only what reading one workbook needs — NO playwright/browsers (the watchdog never scrapes).
      - name: Install (read-only deps)
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyyaml
          pip install -e . --no-deps

      - name: Check today's snapshot
        env:
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # Personal addresses: repo SECRETS, not variables (#42). Not because they are
          # confidential, but because GitHub prints an `env:` block in every run log and
          # masks ONLY secrets — variables would appear verbatim, and in a public repo
          # those logs are world-readable.
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        # Always exits 0 — the watchdog REPORTS; a red X here would itself be noise, and it has no
        # data to protect. The e-mail is the signal.
        #
        # ⚠️ ANCHOR THE DATE, do not use `now` (#38). GitHub cron is best-effort — this job has been
        # observed starting an hour-plus late — so subtracting 2h keeps the check on the day the cron
        # was scheduled for even when the queue is slow. Since #38 snapshot_date is the SAO PAULO
        # day, so the anchor is computed in that timezone, not UTC.
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          from mobile_tracker import watchdog
          # Judge the SAO PAULO day, because that is what snapshot_date means since #38 — not the
          # runner's UTC day. This job fires at 00:30 BRT, so the day being judged is YESTERDAY in
          # Sao Paulo: the one whose four collection passes have just finished.
          sp = datetime.now(ZoneInfo("America/Sao_Paulo"))
          day = (sp - timedelta(hours=2)).date()
          print(f"watchdog: evaluating Sao Paulo day {day} (now {sp:%Y-%m-%d %H:%M} BRT)")
          raise SystemExit(watchdog.run(today=day))
          PY
